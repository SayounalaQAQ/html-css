<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello</title>
</head>
<body>
    <div class="todo-app">

        <div class="title">liuz的todo-app</div>
        <div class="todo-form">
            <input class='todo-input' type="text" placeholder="add todo"">
            <div class="todo-button">add todo</div>
        </div>
        <div class="item compleated">
            <div>
                <input type="checkbox" name="" id="">
                <span class="input">chifan</span>
            </div>
            <div class="del">del</div>
        </div>
        <div class="item">
            <div>
                <input type="checkbox" name="" id="">
                <span class="input">chifan</span>
            </div>
            <div class="del">del</div>
        </div>
        <div class="item">
            <div>
                <input type="checkbox" name="" id="">
                <span class="input">chifan</span>
            </div>
            <div class="del">del</div>
        </div>
    </div>

    <style>
        .compleated{
            text-decoration: line-through;
            opacity: 0.4;
        }
        .del{
            color: red;
        }
        .item{
            
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            width: 80%;
            height: 50px;
            margin: 8px auto;
            padding: 16px;
            border-radius: 20px;
            box-shadow: rgba(44,114,251,1) 0 8px 20px;
        }
        .todo-button{
            width: 100px;
            height: 52px;
            line-height: 52px;
            border-radius: 0px 20px 20px 0px;
            text-align: center;
            background: linear-gradient(
                to right,
                rgb(113,65,168),
                rgba(44,114,251,1)
            );
            color: #ffff;
            cursor: pointer;
            user-select: none;
        }
        .todo-input{
            margin-bottom: 20px;
            padding-left: 15px;
            border: 1px solid #00050b;
            outline: none;
            width: 60%;
            height: 48px;
            border-radius: 20px 0 0 20px;
        }
        .todo-form{
            display: flex;
            margin-top: 30px;
            margin-left: 20px;
        }
        body {
            /* 从左到右的蓝粉渐变 */
            background: linear-gradient(to right, #4a90e2, #ff6b9d);
        }

        .todo-app{
            width: 98%;
            height: 500px;
            background-color: #ffff ;
            border-radius:5px;
            padding-top: 30px;
            box-sizing: border-box;
            margin-top: 40px;
            margin-left: 1%;
        }

        .title{
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            
        }
    </style>



</body>
</html>
